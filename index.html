<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кофейня «Утренний Бриз» — кофе, который будит вдохновение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,600&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#f4e9d8;--paper:#fbf3e4;--coffee:#3a2418;--latte:#6f4a2f;--caramel:#c08a4e;--gold:#d9a441;--sage:#7d8a5f;--ink:#2b1d12;--card:#fffaf0}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;overflow-x:hidden}
h1,h2,h3{font-family:'Playfair Display',serif;font-weight:900;line-height:1.05}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:1150px;margin:0 auto;padding:0 22px}
.eyebrow{font-weight:800;letter-spacing:.22em;text-transform:uppercase;font-size:.75rem;color:var(--caramel)}

/* предлоадер */
#pre{position:fixed;inset:0;background:var(--coffee);z-index:99;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;transition:opacity .8s,visibility .8s}
#pre.done{opacity:0;visibility:hidden}
.cup{width:70px;height:70px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 40% 35%,#e8d3b0,#6f4a2f);position:relative;box-shadow:inset 0 -10px 22px #2b1d12}
.cup::after{content:'';position:absolute;inset:14px;border-radius:50%;background:linear-gradient(120deg,#3a2418,#8a5a34);animation:swirl 3s linear infinite}
@keyframes swirl{to{transform:rotate(360deg)}}
#pre p{color:var(--cream);letter-spacing:.3em;font-size:.7rem;text-transform:uppercase}

/* cursor */
#cursor{position:fixed;top:0;left:0;width:34px;height:34px;border:2px solid var(--caramel);border-radius:50%;pointer-events:none;z-index:98;transform:translate(-50%,-50%);transition:width .2s,height .2s,background .2s;mix-blend-mode:multiply}
#cursor.grow{width:60px;height:60px;background:rgba(217,164,65,.25)}
@media (pointer:coarse){#cursor{display:none}}

/* rain of beans */
#rain{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.bean{position:absolute;top:-40px;color:var(--latte);opacity:.5;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(120vh) rotate(360deg)}}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(8px);background:rgba(251,243,228,.72);border-bottom:1px solid rgba(58,36,24,.08)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:66px}
.logo{font-family:'Playfair Display';font-weight:900;font-size:1.3rem;letter-spacing:.02em}
.logo span{color:var(--gold)}
.nav-links{display:flex;gap:26px;list-style:none}
.nav-links a{text-decoration:none;font-weight:600;font-size:.92rem;position:relative;padding:4px 0}
.nav-links a::after{content:'';position:absolute;left:0;bottom:-2px;width:0;height:2px;background:var(--gold);transition:width .3s}
.nav-links a:hover::after{width:100%}
.burger{display:none;font-size:1.6rem;background:none;border:0;color:var(--ink);cursor:pointer}
@media(max-width:760px){.nav-links{position:fixed;top:66px;right:0;flex-direction:column;background:var(--paper);width:70%;height:calc(100vh - 66px);padding:30px;gap:20px;transform:translateX(100%);transition:transform .4s}.nav-links.open{transform:translateX(0)}.burger{display:block}}

/* HERO */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;padding:120px 0 60px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;position:relative;z-index:2}
.hero h1{font-size:clamp(2.8rem,7vw,5.4rem);margin:14px 0}
.hero h1 em{font-style:italic;color:var(--caramel)}
.hero p.lead{font-size:1.15rem;max-width:460px;color:var(--latte)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 30px}
.chip{background:var(--paper);border:1px solid rgba(58,36,24,.12);padding:8px 14px;border-radius:40px;font-size:.85rem;font-weight:600}
.btns{display:flex;gap:14px;flex-wrap:wrap}
.btn{padding:14px 26px;border-radius:44px;font-weight:800;text-decoration:none;transition:transform .25s,box-shadow .25s;cursor:pointer;border:0;font-size:.95rem}
.btn.gold{background:var(--gold);color:#2b1d12;box-shadow:0 10px 24px rgba(217,164,65,.4)}
.btn.ghost{background:transparent;border:2px solid var(--coffee);color:var(--coffee)}
.btn:hover{transform:translateY(-4px) scale(1.03)}
.hero-art{position:relative}
.hero-art .frame{border-radius:220px 220px 24px 24px;overflow:hidden;box-shadow:0 30px 60px rgba(43,29,18,.35);border:8px solid var(--paper)}
.hero-art .frame img{width:100%;height:520px;object-fit:cover;animation:ken 18s ease-in-out infinite alternate}
@keyframes ken{from{transform:scale(1.05) translate(0,0)}to{transform:scale(1.18) translate(-3%,-3%)}}
.tag{position:absolute;background:var(--paper);padding:10px 16px;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.2);font-weight:800;animation:float 4s ease-in-out infinite}
.tag.t1
